name = "doh-worker"
# 主入口文件
main = "src/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# 开发环境使用 workers.dev
workers_dev = true

# 生产环境自定义路由（取消注释并配置）
# routes = [
#   { pattern = "dns.example.com/*", zone_id = "your-zone-id" }
# ]

# 环境变量
[vars]
UPSTREAM_DOH_URL = "https://cloudflare-dns.com/dns-query"
UPSTREAM_TIMEOUT_MS = "5000"
CACHE_TTL_MAX = "86400"

# 日志
[observability]
enabled = true